<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Playlist</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* =====================================================
   VARIABLES & RESET
===================================================== */
:root {
  --text: #eeeeeb;
  --dim: #a0978d;
  --orange-border: rgba(255, 140, 40, 0.35);
  --sidebar-width: 100px;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  display: flex;
}

#bg-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* =====================================================
   TOGGLE TAB BUTTON (มุมขวาบน)
===================================================== */
.pc-toggle-btn {
  position: fixed;
  top: 24px;
  right: 28px;
  z-index: 200;
  background: rgba(18, 16, 20, 0.85);
  border: 1px solid var(--orange-border);
  border-radius: 12px;
  padding: 10px 16px;
  color: #ffaa33;
  font-family: 'Manrope', sans-serif;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(255, 140, 40, 0.1);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.pc-toggle-btn:hover {
  background: rgba(255, 140, 40, 0.2);
  color: #ffffff;
  border-color: #ff9e3b;
  box-shadow: 0 0 15px rgba(255, 140, 40, 0.4);
  transform: translateY(-2px);
}

.pc-toggle-btn i {
  font-size: 0.9rem;
  transition: transform 0.3s ease;
}

/* =====================================================
   SIDEBAR (LEFT PANEL)
===================================================== */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  height: 100vh;
  width: var(--sidebar-width);
  background: rgba(10, 10, 14, 0.85);
  backdrop-filter: blur(20px);
  border-right: 1px solid var(--orange-border);
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 20px 0 15px 0;
  transform: translateX(-100%);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.sidebar.active {
  transform: translateX(0);
}

.sidebar-top {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  width: 100%;
}

.social-links {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  padding: 0 16px;
}

.social-btn {
  width: 100%;
  height: 38px;
  background: rgba(255, 140, 40, 0.05);
  border: 1px solid rgba(255, 140, 40, 0.2);
  border-radius: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #d4a373;
  text-decoration: none;
  font-size: 14px;
  transition: all 0.25s ease;
}

.social-btn:hover {
  background: rgba(255, 140, 40, 0.25);
  color: #fff;
  border-color: #ff9e3b;
  box-shadow: 0 0 12px rgba(255, 140, 40, 0.4);
  transform: translateY(-2px);
}

.time-widget {
  width: calc(100% - 20px);
  background: rgba(18, 16, 20, 0.85);
  border: 1px solid rgba(255, 160, 50, 0.3);
  border-radius: 14px;
  padding: 12px 4px 10px;
  text-align: center;
  box-shadow: 0 0 15px rgba(255, 140, 40, 0.15), inset 0 0 10px rgba(255, 140, 40, 0.08);
}

.time-widget i {
  font-size: 14px;
  color: #ffaa33;
  filter: drop-shadow(0 0 6px rgba(255, 170, 50, 0.8));
}

.time-location {
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  color: #d4a373;
  margin-top: 4px;
  text-transform: uppercase;
}

.time-display {
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: 0.03em;
  color: #ffffff;
  margin: 4px 0 0 0;
  text-shadow: 0 0 12px rgba(255, 180, 50, 0.9), 0 0 20px rgba(255, 140, 30, 0.5);
}

.time-ampm {
  font-size: 0.7rem;
  color: #ffb347;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-shadow: 0 0 8px rgba(255, 170, 50, 0.6);
}

.time-sub {
  font-size: 0.58rem;
  color: #8c7b6c;
  margin-top: 3px;
}

.time-dots {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
}

.time-dots span {
  width: 5px;
  height: 5px;
  background-color: #ffaa33;
  border-radius: 50%;
  opacity: 0.3;
  box-shadow: 0 0 6px rgba(255, 170, 50, 0.8);
  animation: dotPulse 1.4s infinite ease-in-out;
}

.time-dots span:nth-child(1) { animation-delay: 0s; }
.time-dots span:nth-child(2) { animation-delay: 0.2s; }
.time-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotPulse {
  0%, 100% { opacity: 0.2; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.3); background-color: #ffffff; box-shadow: 0 0 10px rgba(255, 200, 80, 1); }
}

.dev-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-bottom: 15px;
}

.dev-icon {
  font-size: 1.2rem;
  color: #ffd700;
  filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));
  animation: devIconGlow 2s ease-in-out infinite alternate;
}

@keyframes devIconGlow {
  0% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.6)); }
  100% { transform: scale(1.15); filter: drop-shadow(0 0 14px rgba(255, 140, 0, 1)); }
}

.vertical-text {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-size: 1.45rem;
  font-weight: 800;
  letter-spacing: 0.2em;
  user-select: none;
  text-transform: uppercase;
  background: linear-gradient(180deg, #ffd700 0%, #ff8c00 25%, #ffffff 50%, #ff8c00 75%, #ffd700 100%);
  background-size: 100% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: goldShimmer 3s linear infinite;
  filter: drop-shadow(0 0 12px rgba(255, 160, 30, 0.6));
}

@keyframes goldShimmer {
  0% { background-position: 0% 0%; }
  100% { background-position: 0% 200%; }
}

/* =====================================================
   MAIN WRAPPER & OVERLAY (BLUR EFFECT)
===================================================== */
.wrapper {
  margin-left: 0;
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  transition: filter 0.3s ease;
}

.wrapper.blurred {
  filter: blur(8px);
  pointer-events: none;
}

.sidebar-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(6px);
  z-index: 99;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}

.sidebar-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.spotify-frame {
  position: relative;
  z-index: 5;
  width: 100%;
  max-width: 1180px;
  height: auto;
  min-height: 580px;
  border: 1px solid var(--orange-border);
  border-radius: 20px;
  background: linear-gradient(145deg, rgba(18, 15, 22, 0.8), rgba(8, 7, 12, 0.85));
  box-shadow: 0 0 50px rgba(255, 120, 20, 0.15), inset 0 0 30px rgba(255, 140, 40, 0.08);
  backdrop-filter: blur(12px);
  overflow: hidden;
  padding: 35px 42px 22px;
  display: flex;
  flex-direction: column;
  animation: frameSlideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes frameSlideUp {
  0% { opacity: 0; transform: translateY(70px); }
  100% { opacity: 1; transform: translateY(0); }
}

.spotify-frame::before, .spotify-frame::after {
  content: "";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 40%;
  height: 2px;
  background: radial-gradient(circle, rgba(255,180,80,1) 0%, rgba(255,120,0,0) 80%);
  box-shadow: 0 0 15px rgba(255, 150, 50, 0.8);
}
.spotify-frame::before { top: 0; }
.spotify-frame::after { bottom: 0; }

.music-icon {
  position: absolute;
  color: #d4a373;
  opacity: 0.35;
  font-size: 19px;
  pointer-events: none;
  user-select: none;
  animation: floatNote 5s ease-in-out infinite;
}

.note1 { top: 42px; left: 38px; }
.note2 { top: 92px; left: 42px; font-size: 14px; animation-delay: 1.2s; }
.note3 { top: 42px; right: 38px; }
.note4 { top: 92px; right: 42px; font-size: 14px; animation-delay: 2s; }
.note5 { bottom: 37px; left: 38px; font-size: 13px; }
.note6 { bottom: 37px; right: 38px; font-size: 13px; }

@keyframes floatNote {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(3deg); }
}

.spotify-header {
  text-align: center;
  margin-bottom: 25px;
  position: relative;
  z-index: 3;
}

.led-marquee-container {
  overflow: hidden;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  position: relative;
  mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent);
  -webkit-mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent);
}

.led-marquee-track {
  display: flex;
  width: max-content;
  will-change: transform;
  animation: ledScroll 8s linear infinite;
}

.led-item {
  display: flex;
  align-items: center;
  white-space: nowrap;
}

.spotify-title {
  margin: 0;
  font-size: clamp(1.5rem, 2.6vw, 2.4rem);
  font-weight: 800;
  letter-spacing: 0.18em;
  color: #ffffff;
  text-shadow: 0 0 8px rgba(255, 180, 80, 0.9), 0 0 20px rgba(255, 120, 20, 0.6);
  padding-right: 60px;
}

@keyframes ledScroll {
  0% { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(-50%, 0, 0); }
}

.spotify-subtitle {
  margin: 9px 0 0;
  color: var(--dim);
  font-size: 0.82rem;
  letter-spacing: 0.05em;
}

.spotify-container {
  width: 100%;
  max-width: 1180px;
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: 5;
}

.spotify-card {
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  background: #0f0d0e;
  border: 1px solid rgba(255, 180, 100, 0.15);
  box-shadow: 0 20px 55px rgba(0, 0, 0, 0.7);
  transform: perspective(1400px) rotateX(0deg) rotateY(0deg) translateZ(0);
  transition: transform 0.15s ease-out, box-shadow 0.3s ease;
}

.spotify-card:hover {
  box-shadow: 0 28px 70px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 130, 30, 0.15);
}

.spotify-card iframe {
  display: block;
}

.spotify-button-container {
  margin-top: 20px;
  position: relative;
  z-index: 5;
}

.spotify-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 10px 21px;
  border: 1px solid #544336;
  border-radius: 20px;
  background: rgba(20, 16, 14, 0.95);
  color: #eeeeee;
  text-decoration: none;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
  transition: all 0.2s ease;
}

.spotify-button:hover {
  transform: translateY(-2px);
  background: #2a2019;
  border-color: #ff9e3b;
  box-shadow: 0 8px 25px rgba(255, 130, 30, 0.25);
}

.spotify-logo {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #eee;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #111;
  font-size: 7px;
}

.footer {
  text-align: center;
  color: #7a6b5d;
  font-size: 0.68rem;
  margin-top: 15px;
  position: relative;
  z-index: 5;
}

/* =====================================================
   MOBILE RESPONSIVE (<= 768px)
===================================================== */
@media (max-width: 768px) {
  .pc-toggle-btn {
    top: 15px;
    right: 15px;
    padding: 8px 12px;
    font-size: 0.75rem;
  }
  .pc-toggle-btn span {
    display: none;
  }

  .wrapper {
    padding: 12px;
    height: 100vh;
    overflow-y: auto;
  }

  .spotify-frame {
    width: 100%;
    min-height: auto;
    padding: 25px 16px 18px;
    border-radius: 16px;
  }

  .spotify-title {
    font-size: 1.3rem;
    padding-right: 30px;
  }

  .spotify-subtitle {
    font-size: 0.72rem;
  }

  .music-icon {
    display: none;
  }
}
</style>
</head>

<body>

<button class="pc-toggle-btn" id="pcToggleBtn" aria-label="Toggle Sidebar">

<aside class="sidebar active" id="sidebar">

<div class="wrapper blurred" id="mainWrapper">
  <main class="spotify-frame">

    <span class="music-icon note1">♪</span>
    <span class="music-icon note2">♫</span>
    <span class="music-icon note3">♫</span>
    <span class="music-icon note4">♪</span>
    <span class="music-icon note5">♪</span>
    <span class="music-icon note6">♫</span>

    <header class="spotify-header">
      <div class="led-marquee-container">
        <div class="led-marquee-track">
          <div class="led-item"><h1 class="spotify-title">SPOTIFY PLAYLIST</h1></div>
          <div class="led-item"><h1 class="spotify-title">SPOTIFY PLAYLIST</h1></div>

      <div class="spotify-card" id="spotifyCard">
        <iframe 
          data-testid="embed-iframe" 
          style="border-radius:12px" 
          src="https://open.spotify.com/embed/playlist/67puwLKLa3WfOrkzvPzUWa?utm_source=generator&theme=0&si=1300268fb408427a" 
          width="100%" 
          height="352" 
          frameBorder="0" 
          allowfullscreen="" 
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
          loading="lazy">

        <a class="spotify-button" href="https://open.spotify.com/playlist/67puwLKLa3WfOrkzvPzUWa?si=28c5eadb6c7745bd" target="_blank" rel="noopener noreferrer">

<script>
/* =====================================================
   SIDEBAR TOGGLE LOGIC
===================================================== */
const sidebar = document.getElementById('sidebar');
const pcToggleBtn = document.getElementById('pcToggleBtn');
const toggleIcon = document.getElementById('toggleIcon');
const toggleText = document.getElementById('toggleText');
const mainWrapper = document.getElementById('mainWrapper');
const sidebarOverlay = document.getElementById('sidebarOverlay');

function updateSidebarUI(isOpen) {
  sidebar.classList.toggle('active', isOpen);
  sidebarOverlay.classList.toggle('active', isOpen);
  mainWrapper.classList.toggle('blurred', isOpen);

  toggleIcon.className = isOpen ? "fa-solid fa-xmark" : "fa-solid fa-bars";
  toggleText.textContent = isOpen ? "HIDE MENU" : "SHOW MENU";
}

function toggleMenu() {
  const isCurrentlyOpen = sidebar.classList.contains('active');
  updateSidebarUI(!isCurrentlyOpen);
}

pcToggleBtn.addEventListener('click', toggleMenu);
sidebarOverlay.addEventListener('click', () => updateSidebarUI(false));

/* =====================================================
   TIMEZONE CLOCK SCRIPT
===================================================== */
function updateClock() {
  const now = new Date();
  const options = { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hour12: true };
  const timeString = new Intl.DateTimeFormat('en-US', options).format(now);
  const parts = timeString.split(' ');
  
  document.getElementById('clock-time').textContent = parts[0];
  document.getElementById('clock-ampm').textContent = parts[1] || '';
}
setInterval(updateClock, 1000);
updateClock();

/* =====================================================
   ANIMATED 2-TONE BACKGROUND & 3D SPHERE CANVAS
===================================================== */
const canvas = document.getElementById("bg-canvas");
const ctx = canvas.getContext("2d");

let width, height, cx, cy, sphereRadius;
const points = [];
const numLat = 18;
const numLon = 24;

let mouse = { x: 0, y: 0, targetX: 0, targetY: 0, isHover: false };
let rotation = { x: 0, y: 0 };
const snows = [];
const numSnow = 70;
let colorAngle = 0;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  cx = width / 2;
  cy = height / 2;
  sphereRadius = Math.min(width, height) * 0.38;
}
window.addEventListener("resize", resize);
resize();

for (let i = 0; i <= numLat; i++) {
  let theta = (i * Math.PI) / numLat;
  let sinTheta = Math.sin(theta);
  let cosTheta = Math.cos(theta);

  for (let j = 0; j < numLon; j++) {
    let phi = (j * 2 * Math.PI) / numLon;
    points.push({
      x: sinTheta * Math.cos(phi),
      y: cosTheta,
      z: sinTheta * Math.sin(phi),
      lat: i,
      lon: j
    });
  }
}

for (let i = 0; i < numSnow; i++) {
  snows.push({
    x: Math.random() * width,
    y: Math.random() * height,
    r: Math.random() * 2 + 1,
    speedY: Math.random() * 0.8 + 0.4,
    speedX: Math.random() * 0.4 - 0.2,
    opacity: Math.random() * 0.6 + 0.2
  });
}

window.addEventListener("mousemove", (e) => {
  mouse.targetX = (e.clientX - cx) / cx;
  mouse.targetY = (e.clientY - cy) / cy;
  mouse.isHover = true;
});

window.addEventListener("mouseleave", () => {
  mouse.targetX = 0;
  mouse.targetY = 0;
  mouse.isHover = false;
});

function render() {
  colorAngle += 0.005; 
  let gX = cx + Math.cos(colorAngle) * width * 0.4;
  let gY = cy + Math.sin(colorAngle) * height * 0.4;

  let bgGradient = ctx.createRadialGradient(gX, gY, 100, cx, cy, Math.max(width, height) * 0.8);
  bgGradient.addColorStop(0, '#23150c'); 
  bgGradient.addColorStop(0.6, '#090810'); 
  bgGradient.addColorStop(1, '#030305'); 

  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, width, height);

  mouse.x += (mouse.targetX - mouse.x) * 0.05;
  mouse.y += (mouse.targetY - mouse.y) * 0.05;

  rotation.y = mouse.x * 0.8;
  rotation.x = -mouse.y * 0.8;

  const cosX = Math.cos(rotation.x);
  const sinX = Math.sin(rotation.x);
  const cosY = Math.cos(rotation.y);
  const sinY = Math.sin(rotation.y);

  const mouseDist = Math.sqrt(mouse.x * mouse.x + mouse.y * mouse.y);
  const glowFactor = mouse.isHover ? Math.min(1.5, 0.8 + mouseDist * 1.2) : 0.8;

  const projectedPoints = points.map(p => {
    let x1 = p.x * cosY - p.z * sinY;
    let z1 = p.x * sinY + p.z * cosY;
    let y1 = p.y * cosX - z1 * sinX;
    let z2 = p.y * sinX + z1 * cosX;
    let scale = 400 / (400 - z2 * sphereRadius * 0.5);

    return {
      px: x1 * sphereRadius * scale + cx,
      py: y1 * sphereRadius * scale + cy,
      z: z2,
      lat: p.lat,
      lon: p.lon
    };
  });

  ctx.lineWidth = 1;
  for (let i = 0; i < projectedPoints.length; i++) {
    let p1 = projectedPoints[i];
    let nextLon = projectedPoints.find(p => p.lat === p1.lat && p.lon === (p1.lon + 1) % numLon);
    if (nextLon) drawLine(p1, nextLon, glowFactor);

    let nextLat = projectedPoints.find(p => p.lat === p1.lat + 1 && p.lon === p1.lon);
    if (nextLat) drawLine(p1, nextLat, glowFactor);
  }

  projectedPoints.forEach(p => {
    let alpha = ((p.z + 1) / 2) * 0.8 * glowFactor;
    if (alpha > 0) {
      ctx.beginPath();
      ctx.arc(p.px, p.py, 1.8 * glowFactor, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 160, 60, ${alpha})`;
      ctx.shadowBlur = 10 * glowFactor;
      ctx.shadowColor = "rgba(255, 140, 30, 0.8)";
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  });

  for (let i = 0; i < numSnow; i++) {
    let snow = snows[i];
    ctx.beginPath();
    ctx.arc(snow.x, snow.y, snow.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${snow.opacity})`;
    ctx.fill();

    snow.y += snow.speedY;
    snow.x += snow.speedX;

    if (snow.y > height) {
      snow.y = -5;
      snow.x = Math.random() * width;
    }
  }

  requestAnimationFrame(render);
}

function drawLine(p1, p2, glow) {
  let avgZ = (p1.z + p2.z) / 2;
  let alpha = ((avgZ + 1) / 2) * 0.25 * glow;

  if (alpha > 0.02) {
    ctx.beginPath();
    ctx.moveTo(p1.px, p1.py);
    ctx.lineTo(p2.px, p2.py);
    ctx.strokeStyle = `rgba(255, 140, 40, ${alpha})`;
    ctx.stroke();
  }
}

render();

/* =====================================================
   3D MOUSE PARALLAX FOR CARD
===================================================== */
const card = document.getElementById("spotifyCard");

document.addEventListener("mousemove", (event) => {
  if (window.innerWidth <= 768) return;
  const rect = card.getBoundingClientRect();
  const mouseX = event.clientX - (rect.left + rect.width / 2);
  const mouseY = event.clientY - (rect.top + rect.height / 2);

  const rotateY = (mouseX / rect.width) * 4;
  const rotateX = -(mouseY / rect.height) * 4;

  if (
    event.clientX >= rect.left &&
    event.clientX <= rect.right &&
    event.clientY >= rect.top &&
    event.clientY <= rect.bottom
  ) {
    card.style.transform = `
      perspective(1400px)
      rotateX(${rotateX}deg)
      rotateY(${rotateY}deg)
      translateZ(8px)
    `;
  }
});

card.addEventListener("mouseleave", () => {
  card.style.transform = `
    perspective(1400px)
    rotateX(0deg)
    rotateY(0deg)
    translateZ(0)
  `;
});
</script>
